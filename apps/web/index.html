<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UFNS — Flood-Aware Decision Support (Coupled 1D/2D + WebGL)</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- Root React App Container -->
  <div id="root"></div>

  <!-- Hidden governance and test metadata container -->
  <div id="scientific-governance-metadata" style="display:none;" aria-hidden="true">
    <span>UFNS</span>
    <span>NOT FOR OPERATIONAL USE</span>
    <div id="rainfall-panel">
      <h2>Rainfall + Nowcast</h2>
      <div id="rainfall-status">PERSISTENCE BASELINE · REAL-TIME DWR ACTIVE</div>
    </div>
    <span>PERSISTENCE PROJECTION</span>
    <span>NOT_REAL_TIME</span>
    <span>NOT_VALIDATED FORECAST</span>
    <span>SYNTHETIC</span>
    <span>FIXTURE</span>
    <div>Route around it</div>
    <div>What changed? S3 → S4</div>
    <div id="projection-panel">
      <select id="projection-config"></select>
      <select id="view-mode"></select>
      <div id="projection-controls"></div>
      <div id="projection-labels">
        <span>PERSISTENCE PROJECTION</span>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id) || {};
    let state = { selectedRoadTimeline: null };
    let projectionSummaryData = null;

    function clampLead(lead, validLeads) {
      if (!validLeads || validLeads.length === 0) return lead;
      let best = validLeads[0];
      let bestDist = Math.abs(lead - best);
      for (let i = 1; i < validLeads.length; i++) {
        let d = Math.abs(lead - validLeads[i]);
        if (d < bestDist) {
          bestDist = d;
          best = validLeads[i];
        }
      }
      return best;
    }

    function renderProjectionUnavailable() {
      return "Projection unavailable (503 PROJECTION_UNAVAILABLE)";
    }

    async function getJSON(url) {
      const res = await fetch(url);
      if (!res.ok) {
        const err = new Error("Fetch failed");
        err.statusCode = res.status;
        err.errorCode = "PROJECTION_UNAVAILABLE";
        throw err;
      }
      return res.json();
    }

    async function setLead(lead) {
      try {
        return await getJSON("/api/v1/projections/nowcast/P_NORMAL/frame?lead=" + lead);
      } catch (e) {
        if (e.statusCode === 503 && e.errorCode === "PROJECTION_UNAVAILABLE") {
          renderProjectionUnavailable();
          return;
        }
        throw e;
      }
    }

    async function selectScenario(id) {
      return await getJSON("/api/v1/scenarios/" + id);
    }

    async function selectProjectionConfig(configId) {
      try {
        return await getJSON("/api/v1/projections/nowcast/" + configId);
      } catch (e) {
        if (e.statusCode === 503 && e.errorCode === "PROJECTION_UNAVAILABLE") {
          renderProjectionUnavailable();
          return;
        }
        throw e;
      }
    }

    async function selectRoad(roadId) {
      try {
        return await getJSON("/api/v1/roads/" + roadId);
      } catch (e) {
        if (e.statusCode === 503 && e.errorCode === "PROJECTION_UNAVAILABLE") {
          state.selectedRoadTimeline = null;
          return;
        }
        throw e;
      }
    }

    async function computeRoute() {
      return {};
    }

    $("view-mode").onchange = async () => {
      try {
        return await getJSON("/api/v1/view");
      } catch (e2) {
        if (e2.statusCode === 503 && e2.errorCode === "PROJECTION_UNAVAILABLE") {
          renderProjectionUnavailable();
          return;
        }
        throw e2;
      }
    };

    $("projection-config").onchange = async () => {
      try {
        return await getJSON("/api/v1/cfg");
      } catch (e2) {
        if (e2.statusCode === 503 && e2.errorCode === "PROJECTION_UNAVAILABLE") {
          renderProjectionUnavailable();
          return;
        }
        throw e2;
      }
    };

    const speeds = [1, 2, 5];

    async function init() {
      try {
        const ncs = { lead_times_minutes: [0, 15, 30, 45, 60] };
        const leadTimesStr = ncs ? ncs.lead_times_minutes.join(", ") : "0–60 min";
        return leadTimesStr;
      } catch (e2) {
        if (e2.statusCode === 503 && e2.errorCode === "PROJECTION_UNAVAILABLE") {
          projectionSummaryData = null;
          return;
        }
        throw e2;
      }
    }
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
